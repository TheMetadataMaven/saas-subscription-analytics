version: 2

models:
  - name: fct_mrr
    description: >
      Monthly MRR fact table with complete movement breakdown. One row per month 
      containing all MRR metrics, customer counts, growth rates, and key SaaS KPIs.
    meta:
      owner: finance
      pii: false
    columns:
      - name: month_date
        description: First day of month
        tests:
          - unique
          - not_null
      - name: month_key
        description: "Month key in YYYY-MM format"
      - name: active_customers
        description: Customers with MRR > 0 at month end
      - name: new_customers
        description: First-time customers this month
      - name: churned_customers
        description: Customers who churned this month
      - name: ending_mrr
        description: Total MRR at month end
      - name: new_mrr
        description: MRR from new customers
      - name: expansion_mrr
        description: MRR from upgrades
      - name: contraction_mrr
        description: MRR lost to downgrades
      - name: churned_mrr
        description: MRR lost to churn
      - name: net_new_mrr
        description: "Net MRR change: new + expansion - contraction - churn"
      - name: mrr_growth_rate_pct
        description: Month-over-month MRR growth percentage
      - name: gross_mrr_churn_rate_pct
        description: Churned MRR / Beginning MRR
      - name: net_revenue_retention_pct
        description: Net Revenue Retention (NRR) percentage
      - name: quick_ratio
        description: "(New + Expansion) / (Contraction + Churn)"
      - name: arpc
        description: Average Revenue Per Customer

  - name: fct_subscription_events
    description: >
      Enriched subscription lifecycle events for analysis. One row per event 
      with full customer context, tenure metrics, and time dimensions.
    meta:
      owner: product
      pii: false
    columns:
      - name: event_id
        description: Event identifier (PK)
        tests:
          - unique
          - not_null
      - name: subscription_id
        description: Subscription FK
      - name: customer_id
        description: Customer FK
      - name: event_type
        description: Event type
      - name: event_category
        description: Event category
      - name: event_date
        description: Event date
      - name: mrr_change
        description: MRR impact of event
      - name: mrr_after
        description: MRR after event
      - name: tenure_bucket
        description: Customer tenure band at event time
      - name: signup_cohort_month
        description: Customer's signup cohort

  - name: dim_customers
    description: >
      Customer dimension with current state and lifetime metrics. One row per 
      customer containing attributes, subscription state, lifetime metrics, 
      and health indicators.
    meta:
      owner: customer_success
      pii: true
    columns:
      - name: customer_id
        description: Customer identifier (PK)
        tests:
          - unique
          - not_null
      - name: company_name
        description: Company name
      - name: industry
        description: Industry classification
      - name: company_size
        description: Company size band
      - name: customer_status
        description: "Current status: active_paying, active_free, churned"
        tests:
          - accepted_values:
              values: ['active_paying', 'active_free', 'churned', 'unknown']
      - name: current_mrr
        description: Current monthly recurring revenue
      - name: current_arr
        description: Current annual recurring revenue
      - name: lifetime_revenue
        description: Total revenue collected from customer
      - name: days_since_signup
        description: Customer tenure in days
      - name: has_churned
        description: Whether customer has ever churned
      - name: health_status
        description: "Customer health: healthy, stable, at_risk, churned"
      - name: signup_cohort_month
        description: Signup cohort key

  - name: dim_subscriptions
    description: >
      Subscription dimension with plan details and lifecycle state. One row 
      per subscription with plan information, financial metrics, and duration.
    meta:
      owner: finance
      pii: false
    columns:
      - name: subscription_id
        description: Subscription identifier (PK)
        tests:
          - unique
          - not_null
      - name: customer_id
        description: Customer FK
      - name: plan_name
        description: Plan name
      - name: plan_tier
        description: Plan tier classification
      - name: status
        description: Subscription status
      - name: mrr
        description: Monthly recurring revenue
      - name: arr
        description: Annual recurring revenue
      - name: subscription_length_days
        description: Duration of subscription
      - name: tenure_bucket
        description: Duration band
      - name: is_active
        description: Active subscription flag
      - name: is_churned
        description: Churned subscription flag
      - name: churn_timing
        description: "Churn timing classification: early_churn, standard_churn, late_churn"

  - name: rpt_cohort_retention
    description: >
      Pre-aggregated cohort retention matrix. One row per cohort-month combination 
      for building retention heatmaps and cohort comparison analysis.
    meta:
      owner: product
      pii: false
    columns:
      - name: cohort_month
        description: Signup cohort month
        tests:
          - not_null
      - name: cohort_month_key
        description: "Cohort month in YYYY-MM format"
      - name: months_since_signup
        description: "Period number (0-24)"
        tests:
          - not_null
      - name: period_label
        description: "Display label: M0, M1, M2..."
      - name: cohort_size
        description: Original cohort size
      - name: active_customers
        description: Customers still active in this period
      - name: retention_rate
        description: Retention percentage vs cohort size
      - name: retained_mrr
        description: Total MRR from cohort in this period
      - name: mrr_retention_from_m0
        description: MRR retention percentage vs M0 (can exceed 100%)
      - name: cumulative_churn_rate
        description: Cumulative churn percentage

  - name: rpt_churn_risk
    description: >
      Customer-level churn-risk scorecard for active customers. A transparent,
      rules-based score (0-100) built from weighted leading indicators, with a
      risk band and the per-customer MRR exposed. One row per active customer.
    meta:
      owner: customer_success
      pii: true
    columns:
      - name: customer_id
        description: Customer identifier (PK)
        tests:
          - unique
          - not_null
      - name: company_name
        description: Company name
      - name: industry
        description: Industry classification
      - name: company_size
        description: Company size band
      - name: acquisition_channel
        description: Channel the customer was acquired through
      - name: current_plan_tier
        description: Current plan tier
      - name: customer_status
        description: "Lifecycle status (scored set is active_paying or active_free)"
        tests:
          - accepted_values:
              values: ['active_paying', 'active_free']
      - name: signup_cohort_month
        description: Signup cohort key (YYYY-MM)
      - name: tenure_bucket
        description: Customer tenure band
      - name: health_status
        description: Health indicator carried from dim_customers
      - name: current_mrr
        description: Current monthly recurring revenue
      - name: current_arr
        description: Current annual recurring revenue
      - name: peak_mrr
        description: Highest MRR the customer has ever reached
      - name: mrr_erosion_pct
        description: Percent of peak MRR lost (peak - current) / peak
      - name: upgrade_count
        description: Lifetime upgrade (expansion) events
      - name: downgrade_count
        description: Lifetime downgrade (contraction) events
      - name: failed_payments
        description: Count of failed payment attempts
      - name: successful_payments
        description: Count of successful payments
      - name: payment_success_rate
        description: Successful payments / total payments (percent)
      - name: days_since_last_payment
        description: Days since the most recent payment
      - name: times_churned
        description: Number of prior churn events
      - name: is_resurrected
        description: Whether the customer previously churned and returned
      - name: pts_payment_failures
        description: Risk points from failed payments (0-25)
      - name: pts_stale_payment
        description: Risk points from billing silence (0-20)
      - name: pts_downgrades
        description: Risk points from net downgrade behavior (0-15)
      - name: pts_mrr_erosion
        description: Risk points from MRR decline vs peak (0-20)
      - name: pts_prior_churn
        description: Risk points from prior churn history (0-10)
      - name: pts_early_tenure
        description: Risk points from early-tenure fragility (0-10)
      - name: churn_risk_score
        description: "Composite churn-risk score, 0-100 (higher = more likely to churn)"
        tests:
          - not_null
      - name: risk_band
        description: "Risk band derived from score: low, medium, high, critical"
        tests:
          - not_null
          - accepted_values:
              values: ['low', 'medium', 'high', 'critical']
      - name: mrr_at_risk
        description: current_mrr exposed when risk_band is high or critical, else 0

  - name: rpt_unit_economics
    description: >
      Channel-level unit economics: CAC, realized and predicted LTV, LTV:CAC,
      CAC payback, and acquisition ROI. One row per acquisition channel plus a
      blended 'ALL CHANNELS' row. Backbone for ROI and market analysis.
    meta:
      owner: marketing
      pii: false
    columns:
      - name: acquisition_channel
        description: Acquisition channel name (or 'ALL CHANNELS' for the blended row)
        tests:
          - unique
          - not_null
      - name: acquisition_channel_category
        description: Channel category (paid_search, organic, etc.; 'blended' for total)
      - name: is_paid_acquisition
        description: Whether the channel is paid (null on the blended row)
      - name: customers_acquired
        description: Distinct customers acquired through the channel
        tests:
          - not_null
      - name: active_paying_customers
        description: Customers currently active and paying
      - name: churned_customers
        description: Customers who have ever churned
      - name: observed_churn_rate
        description: Logo churn rate over the window, floored at min_monthly_churn_rate
      - name: cac
        description: Assumed customer acquisition cost (spend-weighted on blended row)
      - name: total_lifetime_revenue
        description: Sum of revenue collected from channel customers
      - name: current_mrr
        description: Current MRR from channel customers
      - name: arpc
        description: Average revenue per (paying) customer
      - name: realized_ltv
        description: Average lifetime revenue collected per customer (historical LTV)
      - name: predicted_ltv
        description: "Modeled LTV: ARPC * gross_margin / monthly churn"
      - name: total_acquisition_spend
        description: customers_acquired * CAC
      - name: ltv_to_cac_ratio
        description: "Realized LTV / CAC (healthy >= 3.0)"
      - name: cac_payback_months
        description: "Months to recover CAC: CAC / (ARPC * gross_margin)"
      - name: acquisition_roi_pct
        description: "(realized_ltv - CAC) / CAC * 100"
      - name: avg_tenure_days
        description: Average customer tenure in days
      - name: active_rate_pct
        description: Active paying customers / customers acquired
      - name: churn_rate_pct
        description: Churned customers / customers acquired
